name: Build public_html

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-public-html
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit rebuilt public_html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public_html
          if git diff --cached --quiet; then
            echo "public_html is already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild public_html [skip ci]"
          git push
