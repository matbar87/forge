name: Build public_html

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-public-html
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          # sync-data.py compares when each spreadsheet / JSON was last changed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl==3.1.5

      # The event plan and the Group Time questions can each be edited either
      # as a spreadsheet in plan/ (e.g. uploaded through GitHub's "Add file >
      # Upload files") or as the JSON in src/data/ (e.g. in the admin panel).
      # sync-data.py brings the two into line from the current files (not just
      # this push, so a run cancelled by a newer push loses nothing), and stops
      # with an error if an outdated spreadsheet would overwrite newer changes.
      - name: Sync spreadsheets and JSON data
        run: python scripts/sync-data.py

      - run: npm ci

      # Also validates plan.json and questions.json (scripts/check-*.mjs): broken data stops
      # here, so nothing is committed and the live site keeps the last good
      # version.
      - run: npm run build

      - name: Commit rebuilt public_html (and synced data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public_html src/data plan
          if git diff --cached --quiet; then
            echo "public_html is already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild public_html [skip ci]"
          git push
