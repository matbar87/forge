name: Build public_html

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-public-html
  cancel-in-progress: true

env:
  PLAN_XLSX: plan/plan-wydarzenia.xlsx
  PLAN_JSON: src/data/plan.json

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl==3.1.5

      # The plan can be edited either as the spreadsheet (plan/plan-wydarzenia.xlsx,
      # e.g. uploaded through GitHub's "Add file > Upload files") or as
      # src/data/plan.json. Whichever one this push changed is converted into
      # the other, so both stay in sync. If both changed, the spreadsheet wins.
      - name: Sync plan spreadsheet and plan.json
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit to compare with; leaving the plan as it is."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$before"
          changed=$(git diff --name-only "$before" "$GITHUB_SHA")
          if echo "$changed" | grep -qxF "$PLAN_XLSX"; then
            echo "Spreadsheet changed: regenerating $PLAN_JSON"
            python scripts/xlsx-to-plan.py "$PLAN_XLSX" "$PLAN_JSON"
          elif echo "$changed" | grep -qxF "$PLAN_JSON"; then
            echo "plan.json changed: regenerating $PLAN_XLSX"
            python scripts/plan-to-xlsx.py "$PLAN_JSON" "$PLAN_XLSX"
          else
            echo "Plan unchanged."
          fi

      - run: npm ci

      # Also validates plan.json (scripts/check-plan.mjs): a broken plan stops
      # here, so nothing is committed and the live site keeps the last good
      # version.
      - run: npm run build

      - name: Commit rebuilt public_html (and synced plan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public_html "$PLAN_JSON" "$PLAN_XLSX"
          if git diff --cached --quiet; then
            echo "public_html is already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild public_html [skip ci]"
          git push
